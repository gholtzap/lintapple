<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interface example</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body>
    <main class="ui-page ui-stack" data-ui-stack>
      <h1>Projects</h1>
      <div class="ui-actions" data-ui-actions data-ui-container>
        <button type="button">Add project</button>
        <button type="button">Export</button>
      </div>
      <section class="ui-panel" data-ui-radius data-ui-container>
        <div class="ui-surface" data-ui-radius-inner>
          <table>
            <thead><tr><th>Project</th><th class="ui-numeric">Sessions</th></tr></thead>
            <tbody><tr><td>Website</td><td data-ui-number>12,441</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
